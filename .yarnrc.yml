    npmMinimalAgeGate: 0

packageExtensions:
  "@parcel/node-resolver-core@*":
    peerDependenciesMeta:
      "@parcel/core":
        optional: true
  "@parcel/types@*":
    peerDependenciesMeta:
      "@parcel/core":
        optional: true
