services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # default user is "opam"
      - ..:/workspace:cached
      - build:/workspace/_build:cached
      - node_modules:/workspace/node_modules:cached
      - opam-5.5.2-2.6:/home/opam/.opam:cached
      - ${HOME}/.claude:/home/opam/.claude
      # Add database folders to dev container
      - db-root:/databases/db-root/:ro
      - db-tenant:/databases/db-tenant/:ro
    env_file: [.env]
    depends_on:
      - database-root
      - database-tenant
      - mailtrap
    ports:
      - 3016:3000
      - 3017:3000
    command: sleep infinity

  database-root:
    image: mariadb:10.6
    restart: unless-stopped
    command: --max_allowed_packet=629145600
    ports: [ 3316:3306 ]
    environment:
      - TZ=Europe/Zurich
      - MYSQL_ALLOW_EMPTY_PASSWORD='yes'
      - MYSQL_ROOT_HOST=%
      - MYSQL_DATABASE=development
      - MYSQL_USER=root
    volumes:
      - db-root:/var/lib/mysql
      - ./init_root:/docker-entrypoint-initdb.d/:ro

  database-tenant:
    image: mariadb:10.6
    restart: unless-stopped
    command: --max_allowed_packet=629145600
    ports: [ 3317:3306 ]
    environment:
      - TZ=Europe/Zurich
      - MYSQL_ALLOW_EMPTY_PASSWORD='yes'
      - MYSQL_ROOT_HOST=%
      - MYSQL_DATABASE=dev_econ
      - MYSQL_USER=root
    volumes:
      - db-tenant:/var/lib/mysql
      - ./init_tenant:/docker-entrypoint-initdb.d/:ro

  adminer:
    image: adminer:standalone
    restart: unless-stopped
    ports: [ 8080:8080 ]
    depends_on:
      - database-root
      - database-tenant

  phpmyadmin:
    image: phpmyadmin
    restart: unless-stopped
    ports:
      - 8082:80
    environment:
      - PMA_ARBITRARY=1
    depends_on:
      - database-root
      - database-tenant

  mailtrap:
    image: axllent/mailpit:v1.30
    restart: unless-stopped
    container_name: mailtrap-pool
    hostname: mailtrap-pool
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  build:
  node_modules:
  opam-5.5.2-2.6:
  db-root:
  db-tenant:
